services:
  - type: web
    name: elakabazar-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/areas/
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: elakabazar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://elakabazar-web.onrender.com
      - key: FRONTEND_URL
        value: https://elakabazar-web.onrender.com
      - key: PAYMENT_CALLBACK_BASE_URL
        value: https://elakabazar-api.onrender.com
      - key: SSLCOMMERZ_SANDBOX
        value: "1"

  - type: web
    name: elakabazar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://elakabazar-api.onrender.com/api/v1

databases:
  - name: elakabazar-db
    databaseName: elakabazar
    user: elakabazar
    plan: free
    region: singapore
